<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Canvas Note</title>
<script>
  // 読み込み中に白く光らないよう、テーマを先に決める
  try {
    const t = JSON.parse(localStorage.getItem('theme') || '"auto"');
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>
<!-- ログイン画面（許可したアカウントでログインするまで、ノートを見せない） -->
<div id="gate">
  <div class="gate-box">
    <img src="icon.svg" width="56" height="56" alt="">
    <h1>Canvas Note</h1>
    <p id="gate-msg">確認中…</p>
    <button id="gate-login" hidden>Google でログイン</button>
  </div>
</div>

<canvas id="main"></canvas>
<canvas id="overlay"></canvas>

<!-- 左上：メニューとボード名 -->
<div id="topbar" class="chip">
  <button class="ibtn" id="btn-drawer" data-icon="menu" title="ボード一覧"></button>
  <input id="title" spellcheck="false" autocomplete="off" aria-label="ボード名">
</div>

<!-- 右上：同期とズーム -->
<div id="topright">
  <button id="sync" class="chip s-off"><span class="dot"></span><span data-icon="cloud"></span><span class="label">同期オフ</span></button>
  <button id="zoom" class="chip" title="100%に戻す">100%</button>
</div>

<!-- ツールバー -->
<div id="dock">
  <div id="options" class="chip"></div>
  <div id="ruler-opts" class="chip"></div>
  <div id="toolbar" class="chip">
    <button class="ibtn tool" data-tool="pen" data-icon="pen" title="ペン (P)"></button>
    <button class="ibtn tool" data-tool="hl" data-icon="highlighter" title="マーカー (M)"></button>
    <button class="ibtn tool" data-tool="eraser" data-icon="eraser" title="消しゴム (E)"></button>
    <button class="ibtn tool" data-tool="lasso" data-icon="lasso" title="投げ縄 (L)"></button>
    <button class="ibtn tool" data-tool="hand" data-icon="hand" title="移動 (H / Space)"></button>
    <span class="sep"></span>
    <button class="ibtn" id="btn-ruler" data-icon="ruler" title="定規 (R)"></button>
    <button class="ibtn" id="btn-import" data-icon="image" title="画像・PDF を取り込む（ドラッグ＆ドロップ・貼り付けでも可）"></button>
    <button class="ibtn pop-trigger" id="btn-tpl" data-icon="shapes" title="テンプレート"></button>
    <span class="sep"></span>
    <button class="ibtn" id="btn-undo" data-icon="undo" title="元に戻す (Ctrl+Z)"></button>
    <button class="ibtn" id="btn-redo" data-icon="redo" title="やり直す (Ctrl+Shift+Z)"></button>
    <span class="sep"></span>
    <button class="ibtn" id="btn-bg" data-icon="grid" title="背景"></button>
    <button class="ibtn" id="btn-more" data-icon="more" title="その他"></button>
  </div>
</div>

<!-- 投げ縄で選択中のバー -->
<div id="selbar" class="chip" hidden>
  <div class="swatches" id="sel-colors"></div>
  <span class="sep"></span>
  <button class="toggle" id="sel-cloud" hidden></button>
  <button class="ibtn" id="sel-tpl" data-icon="shapes" title="テンプレートに保存（線だけ。画像は入りません）"></button>
  <button class="ibtn" id="sel-dup" data-icon="copy" title="複製"></button>
  <button class="ibtn danger" id="sel-del" data-icon="trash" title="削除 (Delete)"></button>
</div>

<!-- ポップオーバー -->
<div id="pop-bg" class="pop chip" hidden>
  <div class="pop-label">背景</div>
  <div class="seg" id="bg-type">
    <button data-v="none">なし</button>
    <button data-v="grid">方眼</button>
    <button data-v="lines">罫線</button>
    <button data-v="dots">ドット</button>
  </div>
  <div class="pop-label">間隔</div>
  <div class="seg" id="bg-size">
    <button data-v="20">狭い</button>
    <button data-v="32">標準</button>
    <button data-v="48">広い</button>
  </div>
  <div class="pop-label">濃さ</div>
  <input type="range" id="bg-strength" min="0" max="100" step="5" aria-label="背景の線の濃さ">
</div>

<div id="pop-more" class="pop chip" hidden>
  <button class="mitem" data-act="fit">全体を表示</button>
  <button class="mitem" data-act="png">PNGで書き出し</button>
  <hr>
  <button class="mitem" data-act="export">バックアップを書き出し (JSON)</button>
  <button class="mitem" data-act="import">バックアップを読み込み</button>
  <hr>
  <div class="pop-label">テーマ</div>
  <div class="seg" id="theme">
    <button data-v="auto">自動</button>
    <button data-v="light">ライト</button>
    <button data-v="dark">ダーク</button>
  </div>
  <div class="pop-label">指で描く</div>
  <div class="seg" id="finger">
    <button data-v="auto">自動</button>
    <button data-v="always">常に描く</button>
    <button data-v="never">描かない</button>
  </div>
  <p class="hint">自動：ペン（Apple Pencil など）を使うと、それ以降は指でスクロールになります。</p>
  <div class="pop-label">ペンが触れたとみなす強さ <b id="penmin-val"></b></div>
  <input type="range" id="penmin" min="0" max="30" step="1" aria-label="ペンが触れたとみなす強さ">
  <button class="mitem" data-act="pencal">ペンの調整…（自動で合わせる）</button>
  <p class="hint">ペンを近づけただけで書けてしまうときは上げてください。軽く書いた線が途切れるときは下げてください（0 で判定なし）。</p>
  <a class="about-link" href="changelog.html">変更履歴</a>
</div>

<div id="pop-tpl" class="pop chip" hidden>
  <div class="pop-label">テンプレート（押すと画面の真ん中に置きます）</div>
  <div id="tpl-list"></div>
</div>

<div id="pop-sync" class="pop chip" hidden>
  <div class="pop-label">クラウド同期</div>
  <div id="sync-user" class="sync-user"></div>
  <div id="sync-state" class="hint"></div>
  <hr>
  <button class="mitem" id="sync-now">今すぐ同期</button>
  <button class="mitem" id="sync-out">ログアウト</button>
</div>

<!-- ボード一覧 -->
<div id="drawer-scrim" hidden></div>
<aside id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>ボード</h2>
    <div class="drawer-actions">
      <button class="ibtn" id="btn-new-folder" data-icon="folder-plus" title="新しいフォルダ"></button>
      <button class="ibtn" id="btn-new" data-icon="plus" title="新しいボード"></button>
    </div>
  </div>
  <ul id="board-list"></ul>
  <div id="usage" hidden>
    <div class="usage-head"><span>クラウドの使用量</span><b id="usage-total"></b></div>
    <div class="usage-bar"><i id="usage-fill"></i></div>
    <div class="usage-detail" id="usage-detail"></div>
  </div>
</aside>
<div id="pop-move" class="pop chip" hidden></div>
<div id="pop-folder" class="pop chip" hidden></div>

<input type="file" id="file-import" accept="application/json,.json" hidden>
<input type="file" id="file-media" accept="image/*,application/pdf,.pdf" multiple hidden>
<div id="toast" hidden></div>
<!-- ペンの調整 -->
<div id="pencal" hidden>
  <div class="dlg-box chip" role="dialog" aria-modal="true">
    <div class="dlg-title">ペンの反応を調整</div>
    <div class="dlg-msg" id="pencal-msg"></div>
    <div id="pencal-pad">
      <div class="pc-meter"><i id="pencal-fill"></i><b id="pencal-th"></b></div>
      <div class="pc-scale"><span>0%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span></div>
      <div id="pencal-state">枠の上でペンを動かしてください</div>
    </div>
    <div class="pc-now">触れたとみなす強さ：<b id="pencal-now"></b></div>
    <div class="dlg-btns">
      <button id="pencal-auto">自動で合わせる</button>
      <button class="primary" id="pencal-close">閉じる</button>
    </div>
  </div>
</div>
<!-- 確認用の小さな画面（選択肢つき） -->
<div id="dlg" hidden>
  <div class="dlg-box chip" role="dialog" aria-modal="true">
    <div class="dlg-title"></div>
    <div class="dlg-msg"></div>
    <div class="dlg-btns"></div>
  </div>
</div>

<!-- 更新したら v= の数字を上げる（古いファイルがキャッシュに残らないように） -->
<script src="firebase-config.js?v=38"></script>
<script src="ruler.js?v=38"></script>
<script src="app.js?v=38"></script>
</body>
</html>
