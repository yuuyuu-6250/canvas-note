<!doctype html>
<!--
  新しいページの雛形。このファイルをコピーして、名前を変えて使う（例：help.html）
  ・色や角丸は style.css の変数（--text, --accent など）を使うと、ダークモードに自動で合う
  ・style.css?v= の数字は index.html と同じにそろえる（更新したら一緒に上げる）
  ・<main> の中の「部品の見本」は、要らないものを消して使う
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>ページの名前 - Canvas Note</title>
<script>
  // ノートと同じテーマ（ライト／ダーク）を、表示する前に決める
  try {
    const t = JSON.parse(localStorage.getItem('theme') || '"auto"');
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1c20' : '#f6f7f9'; // 上のバーの色
  } catch (e) {}
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=40">
<style>
  /* ノート用の「スクロールさせない・文字を選ばせない」設定を、ふつうのページ用に戻す */
  html { height: auto; overflow-y: auto; }
  body { height: auto; overflow: visible; overscroll-behavior: auto; -webkit-user-select: text; user-select: text; touch-action: pan-y; }

  /* ページの骨組み */
  main { max-width: 640px; margin: 0 auto; padding: calc(24px + var(--safe-t)) 16px calc(40px + var(--safe-b)); }
  .back { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 13px; color: var(--muted); margin: 32px 0 8px; font-weight: 600; }
  p { line-height: 1.7; margin: 0 0 12px; }
  .lead { color: var(--muted); }
  a { color: var(--accent); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--hover); padding: 1px 5px; border-radius: 5px; }

  /* カード（ノートのツールバーと同じ .chip の見た目） */
  .card { padding: 14px 16px; margin-bottom: 10px; }
  .card h3 { font-size: 15px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ボタン */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; background: var(--hover); font-weight: 600; text-decoration: none; color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn svg { width: 17px; height: 17px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* 入力欄 */
  label.field { display: grid; gap: 6px; margin-bottom: 12px; }
  label.field span { font-size: 12px; color: var(--muted); }
  .input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
  .input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  /* 区切り線つきのリスト（変更履歴と同じ） */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .list li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* お知らせの枠 */
  .note { padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--text); font-size: 13px; line-height: 1.6; }
  .note.warn { background: var(--bad-bg); }

  /* 補足の小さな文字 */
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← ノートに戻る</a>
  <h1>ページの名前</h1>
  <p class="lead">ここにページの説明を書きます。</p>

  <!-- ===== ここから下は部品の見本。要らないものは消す ===== -->

  <h2>文章</h2>
  <p>ふつうの段落です。<a href="changelog.html">リンク</a> や <code>コード</code> も使えます。</p>
  <div class="note">お知らせの枠です（<code>.note</code>）。</div>
  <p></p>
  <div class="note warn">注意の枠です（<code>.note.warn</code>）。</div>

  <h2>カード</h2>
  <div class="card chip">
    <h3>カードの見出し</h3>
    <p>ツールバーと同じ見た目の枠（<code>.chip</code>）です。</p>
  </div>
  <div class="card chip">
    <h3>もう1枚</h3>
    <p>並べるとリストのようにも使えます。</p>
  </div>

  <h2>ボタン</h2>
  <div class="row">
    <button class="btn primary">決定</button>
    <button class="btn">ふつう</button>
    <button class="btn danger">削除</button>
    <a class="btn" href="./">リンクのボタン</a>
  </div>

  <h2>アイコンのボタン（ノートと同じ）</h2>
  <div class="row chip" style="display: inline-flex; padding: 4px 6px; gap: 2px;">
    <button class="ibtn active" data-icon="pen" title="選ばれている"></button>
    <button class="ibtn" data-icon="copy" title="ふつう"></button>
    <span class="sep"></span>
    <button class="ibtn danger" data-icon="trash" title="危ない操作"></button>
  </div>

  <h2>切り替え</h2>
  <div class="seg" id="demo-seg">
    <button data-v="a" class="active">ひとつめ</button>
    <button data-v="b">ふたつめ</button>
    <button data-v="c">みっつめ</button>
  </div>
  <p></p>
  <button class="toggle active" id="demo-toggle">オン／オフ</button>

  <h2>入力欄</h2>
  <label class="field"><span>名前</span><input class="input" placeholder="入力してください"></label>
  <label class="field"><span>メモ</span><textarea class="input" rows="3"></textarea></label>
  <p class="hint">補足の小さな文字（<code>.hint</code>）。</p>

  <h2>リスト</h2>
  <ul class="list">
    <li><span>項目 1</span><span>12</span></li>
    <li><span>項目 2</span><span>345</span></li>
    <li><span>項目 3</span><span>6,789</span></li>
  </ul>

  <!-- ===== 見本ここまで ===== -->
</main>

<script>
  // アイコン：使う名前の形をここに足す（ノートの app.js の ICONS からコピーできる）
  const ICONS = {
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  };
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[el.dataset.icon] || ''}</svg>`;
  });

  // 切り替えの見本の動き
  document.querySelectorAll('#demo-seg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#demo-seg button').forEach(x => x.classList.toggle('active', x === b));
  });
  const tg = document.getElementById('demo-toggle');
  tg.onclick = () => tg.classList.toggle('active');
</script>
</body>
</html>
